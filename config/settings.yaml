# ============================================================
# settings.yaml — Quant-Pilot 全局参数唯一来源
# ============================================================
# 版本: v1.0 | 创建: 2025-07-18
#
# 规则:
#   - 所有参数必须从此文件读取，禁止在代码中硬编码
#   - 修改此文件中的参数值，必须在 PROJECT_MEMORY.md 中记录变更
#   - 资金/风险相关参数修改前必须先向用户确认
# ============================================================

# --- 项目元数据 ---
project:
  name: "Quant-Pilot"
  version: "0.1.0"
  random_seed: 42
  mode: "research"              # 运行模式: research(默认, 研究/模拟) | paper(纸上) | real(真实资金, 需明确启用)
  strategy_version: "v0.2"      # 策略版本: v0.1=1/σ² 旧口径(2026-09-13 前), v0.2=spec v3.0 修正后

# --- 数据存储 ---
storage:
  db_path: "data/quant_pilot.duckdb"
  cleaned_dir: "data/cleaned"
  factors_dir: "data/factors"

# --- 数据获取 ---
data_fetch:
  source: "sina"                # sina (默认, 新浪财经, 稳定) | eastmoney (备用)
  default_start_date: "20190101"
  # 反封锁措施：每次 API 调用后随机休眠 (秒) — 仅 eastmoney
  min_sleep: 0.1
  max_sleep: 0.5
  # 重试配置
  max_retries: 3
  retry_backoff_base: 5  # 秒, 指数退避基数

# --- 标的池 (P0 初始: ~20 只 ETF) ---
universe:
  # 宽基 ETF (T+1)
  broad_base:
    - {symbol: "510300", name: "沪深300ETF",market_type: "A股", settlement: "T+1"}
    - {symbol: "510050", name: "上证50ETF", market_type: "A股", settlement: "T+1"}
    - {symbol: "510500", name: "中证500ETF",market_type: "A股", settlement: "T+1"}
    - {symbol: "159915", name: "创业板ETF",market_type: "A股", settlement: "T+1"}
    - {symbol: "588000", name: "科创50ETF",market_type: "A股", settlement: "T+1"}
    - {symbol: "512100", name: "中证1000ETF",market_type: "A股", settlement: "T+1"}

  # 行业主题 ETF (T+1)
  sector:
    - {symbol: "159995", name: "芯片ETF", market_type: "A股", settlement: "T+1"}
    - {symbol: "512480", name: "半导体ETF", market_type: "A股", settlement: "T+1"}
    - {symbol: "512010", name: "医药ETF", market_type: "A股", settlement: "T+1"}
    - {symbol: "159928", name: "消费ETF", market_type: "A股", settlement: "T+1"}
    - {symbol: "512880", name: "证券ETF", market_type: "A股", settlement: "T+1"}
    - {symbol: "516160", name: "新能源ETF", market_type: "A股", settlement: "T+1"}
    - {symbol: "512690", name: "酒ETF", market_type: "A股", settlement: "T+1"}

  # 跨境 / 商品 ETF (T+0)
  cross_border_commodity:
    - {symbol: "513100", name: "纳指ETF",          market_type: "跨境", settlement: "T+0"}
    - {symbol: "159920", name: "恒生ETF",          market_type: "跨境", settlement: "T+0"}
    - {symbol: "513500", name: "标普500ETF",       market_type: "跨境", settlement: "T+0"}
    - {symbol: "159941", name: "纳指ETF(广发)",     market_type: "跨境", settlement: "T+0"}
    - {symbol: "518880", name: "黄金ETF",          market_type: "商品", settlement: "T+0"}
    - {symbol: "513050", name: "中概互联ETF",       market_type: "跨境", settlement: "T+0"}

# --- 交易成本 (实盘与回测必须一致) ---
# 口径确认 (2026-09-11, 用户拍板): 佣金 round-trip 0.15% = 单边 0.075%
# 情景命名 (spec v3.0 §6.3, C08): 当前使用 "legacy_stress" = 明确命名的旧压力情景,
#   滑点 max(0.15%/笔, 交易金额/日均成交额 × 0.5%) 不是经校准的市场冲击定律;
#   基准/更不利成本情景供实验对照 (M5/M6 声明, 研究示例须标注来源)。
trading_cost:
  scenario: "legacy_stress"     # 当前成本情景名 (随回测报告输出)
  commission_rate: 0.00075      # 单边佣金率 (研究假设: round-trip 0.15%)
  min_commission_per_trade: 0.0 # 最低佣金/笔 (ETF 常见免最低; 引擎按 max(费率×金额, 本值) 计)
  slippage_base: 0.0015         # 滑点下限 0.15%/笔 (旧压力情景参数)
  impact_coefficient: 0.005     # 冲击项系数 (金额/日均额 × 0.5%; 旧压力情景参数)
  slippage_lookback_days: 20    # 日均成交额回看窗口 (交易日)
  stamp_duty: 0.0               # ETF 免印花税

# --- 回测 (T0.9) ---
backtest:
  initial_cash: 100000.0        # 初始资金 (元; 资金体量 <10万)

# --- 数据质量 (产品感知涨跌幅, C10) ---
data_quality:
  daily_change:
    default_limit_pct: 10.0      # 默认涨跌幅限制 (主板/跨境/商品 ETF)
    limit_overrides_pct:         # 20% 涨跌幅板 (创业板/科创板相关 ETF; 生效区间待 M3)
      "159915": 20.0
      "588000": 20.0
    review_buffer_pct: 2.0       # 超限容差: ≤限制+容差 → 警告复核(如权益事件/舍入); 超 → 阻断

# --- 宏观择时 (第一层漏斗) ---
macro_timing:
  scope: "a_share"              # 宏观信号作用域 (spec §5.2): a_share=A股合计上限(默认);
                                # all_composite=全组合择时 (显式研究版本, v0.1 旧行为)
  weight_trend: 0.30            # 趋势动量权重
  weight_breadth: 0.25          # 市场宽度权重
  weight_volatility: 0.20       # 波动率权重 (P1)
  weight_capital_flow: 0.15     # 资金流向权重 (P1)
  weight_macro_env: 0.10        # 宏观环境权重 (P1)
  ma_short: 20                  # 短期均线周期
  ma_long: 60                   # 长期均线周期
  score_plunge_threshold: 30    # 单日得分骤降阈值 → 强制减仓

# --- 标的清洗 (第二层漏斗) ---
universe_filter:
  min_avg_volume: 5000000       # 日均成交额 ≥ 500 万
  min_list_days: 60             # 上市 ≥ 60 个交易日
  max_premium_pct: 3.0          # 溢价率 ≤ 3%
  liquidity_concentration_warn: 0.005  # 持仓/日均成交额 > 0.5% → 警告

# --- 组合优化 (第四层漏斗) ---
portfolio:
  # 加权方法 (spec §5.3, C01): inverse_volatility = w∝1/σ (默认, 原意);
  # inverse_variance = w∝1/σ² (v0.1 旧口径, 保留对照); P1 另加 risk_parity
  method: "inverse_volatility"
  non_a_share_max_total: 0.30   # 跨境/商品合计上限 (研究示例待用户评估; spec §5.2 非A独立上限)
  vol_lookback: 20              # 波动率回溯窗口 (交易日)
  max_positions: 5              # 最大持仓数
  min_positions: 1              # 最小持仓数

# --- 风控执行 (第五层漏斗) ---
risk_management:
  atr_period: 14                # ATR 计算周期
  atr_multiplier: 2.0           # 移动止损 N 倍 ATR
  safe_position_pct: 0.30       # 宏观骤降后安全仓位比例
  min_hold_days: 3              # 最低持仓天数
  turnover_threshold: 0.15      # 仓位差异 < 15% 不调仓

# --- 消息推送 ---
notification:
  channel: "pushplus"           # pushplus / feishu / email
  pushplus_token: ""            # 从环境变量或本地文件读取
  retry_count: 3

# --- 日志 ---
logging:
  config_file: "config/logging.conf"
  default_level: "INFO"
