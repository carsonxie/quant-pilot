[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/data_pipeline",
    "src/data_pipeline/fetchers",
    "src/data_pipeline/processors",
    "src/strategies",
    "src/backtest",
    "src/orchestration",
    "src/factor_engineering",
    "src/models",
    "dashboard",
]

[project]
name = "quant-pilot"
version = "0.1.0"
description = "量化辅助决策与投研系统 — A股ETF五层决策漏斗"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Quant-Pilot Team"}
]

dependencies = [
    "akshare>=1.14.0",
    "duckdb>=1.1.0",
    "polars>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "matplotlib>=3.7.0",
    "joblib>=1.3.0",
    "pyarrow>=15.0.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ipykernel>=6.25.0",
    "jupyter>=1.0.0",
]
p1 = [
    "plotly>=5.18.0",
    "alphalens-reloaded>=0.4.0",
    # vectorbt requires numba → llvmlite, may need Python <=3.12
    # Install separately when reaching P1
    # "vectorbt>=0.5.0",
]
p2 = [
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
]

[project.scripts]
fetch-data = "data_pipeline.fetchers.akshare_fetcher:main"
init-db = "data_pipeline.duckdb_manager:main"
daily = "orchestration.daily_pipeline:main"
backtest = "backtest.custom_loop:main"
account-import = "data_pipeline.accounting:main"
factor-check = "scripts.validate_registry:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
